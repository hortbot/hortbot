x-golang-image: &golang-image
  image: golang:1.26

services:
  bot:
    <<: *golang-image
    volumes:
      - .:/app:ro
      - gopath:/go
      - go-build:/root/.cache/go-build
    working_dir: /app
    command: go run -mod=readonly . bot
    stop_grace_period: 45s
    depends_on:
      - db
    env_file:
      - config/bot.env
      - config/twitch.env
    environment:
      - HB_DEBUG=true
      - HB_DB=postgres://postgres:mysecretpassword@db:5432/postgres?sslmode=disable
      - HB_DB_MIGRATE_UP=true

  web:
    <<: *golang-image
    volumes:
      - .:/app:ro
      - gopath:/go
      - go-build:/root/.cache/go-build
    working_dir: /app
    command: go run -mod=readonly . web
    stop_grace_period: 45s
    depends_on:
      - db
    ports:
      - "5000:5000"
    env_file:
      - config/twitch.env
    environment:
      - HB_DEBUG=true
      - HB_DB=postgres://postgres:mysecretpassword@db:5432/postgres?sslmode=disable
      - HB_DB_MIGRATE_UP=true
      - HB_WEB_ADMIN_AUTH=admin:admin

  conduit:
    <<: *golang-image
    volumes:
      - .:/app:ro
      - gopath:/go
      - go-build:/root/.cache/go-build
    working_dir: /app
    command: go run -mod=readonly . conduit
    stop_grace_period: 45s
    depends_on:
      - db
    env_file:
      - config/conduit.env
      - config/twitch.env
    environment:
      - HB_DEBUG=true
      - HB_DB=postgres://postgres:mysecretpassword@db:5432/postgres?sslmode=disable
      - HB_DB_MIGRATE_UP=true

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:mysecretpassword@db:5432/postgres?sslmode=disable

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=mysecretpassword

volumes:
  gopath:
  go-build:
